[pytest]
DJANGO_SETTINGS_MODULE = denticita.settings_test
python_files = test_*.py
testpaths = tests
addopts = -q
markers =
    verificacion_whatsapp: flujo con la API de WhatsApp Cloud (VERIFICACION_WHATSAPP=1)
    pagos_adelantados: adelantos activos en la plataforma (PAGOS_ADELANTADOS=1)
    real_turnstile: usa la verificación real de Turnstile en lugar del reemplazo de pruebas
filterwarnings =
    ignore:No directory at:UserWarning
