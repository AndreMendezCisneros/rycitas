<div class="campo{% if campo.field.widget.input_type == 'checkbox' %} campo-casilla{% endif %}{% if campo.errors %} con-error{% endif %}">
  {% if campo.field.widget.input_type == 'checkbox' %}
    {{ campo }} <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<p class="dato">{{ campo.help_text }}</p>{% endif %}
  {% for e in campo.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
