name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: denticita
          POSTGRES_PASSWORD: denticita
          POSTGRES_DB: denticita
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U denticita"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: denticita
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Sin migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
      # RNF-13: el motor de agenda debe tener al menos 80 % de cobertura.
      - run: pytest --cov=agenda.motor --cov=citas.estimacion --cov-fail-under=80

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --flavor prod --release --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: denticita-apk
          path: app_doctor/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14
