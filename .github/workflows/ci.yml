name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: denticita
          POSTGRES_PASSWORD: denticita
          POSTGRES_DB: denticita
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U denticita"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: denticita
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Sin migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
      # RNF-13: el motor de agenda debe tener al menos 80 % de cobertura.
      - run: pytest --cov=agenda.motor --cov=citas.estimacion --cov-fail-under=80

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: La configuración de producción apunta al dominio real
        run: |
          if grep -q "TU-DOMINIO" config/prod.json; then echo "config/prod.json todavía dice TU-DOMINIO"; exit 1; fi
      # El APK de producción solo se compila con los secretos del repositorio (Settings → Secrets → Actions):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PROPERTIES (contenido de key.properties con storeFile=publicacion.jks)
      #   y GOOGLE_SERVICES_PROD (contenido de google-services.json del proyecto de Firebase de producción).
      - name: Secretos de firma y Firebase
        id: secretos
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_PROD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ] || [ -z "$GOOGLE_SERVICES" ]; then
            echo "Sin secretos de publicación: se omite el APK de producción."
            echo "listos=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/publicacion.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          mkdir -p android/app/src/prod
          printf '%s\n' "$GOOGLE_SERVICES" > android/app/src/prod/google-services.json
          echo "listos=1" >> "$GITHUB_OUTPUT"
      - if: steps.secretos.outputs.listos == '1'
        run: flutter build apk --flavor prod --release --dart-define-from-file=config/prod.json
      - if: steps.secretos.outputs.listos == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rycitas-apk
          path: app_doctor/build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14
